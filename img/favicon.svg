<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="rubber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#222"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="66" height="128"/>
    </clipPath>
  </defs>

  <!-- Tire outer ring - left half (3D feel) -->
  <g clip-path="url(#leftHalf)">
    <!-- Outer tire -->
    <circle cx="64" cy="64" r="58" fill="url(#rubber)" stroke="#555" stroke-width="2"/>
    <!-- Tread pattern grooves -->
    <circle cx="64" cy="64" r="54" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
    <circle cx="64" cy="64" r="50" fill="none" stroke="#333" stroke-width="0.8"/>
    <!-- Rim -->
    <circle cx="64" cy="64" r="30" fill="#1a1a1a" stroke="url(#rim)" stroke-width="3"/>
    <!-- Hub -->
    <circle cx="64" cy="64" r="12" fill="#2a2a2a" stroke="#999" stroke-width="1.5"/>
    <!-- Lug nuts -->
    <circle cx="64" cy="49" r="2.5" fill="#aaa"/>
    <circle cx="51" cy="59" r="2.5" fill="#aaa"/>
    <circle cx="54" cy="76" r="2.5" fill="#aaa"/>
  </g>

  <!-- Cross-section face (right half) -->
  <!-- Outer rubber section -->
  <path d="M66 6 L66 122 
           Q66 126 70 126 L70 126 
           Q78 126 78 118 L78 118 
           L78 10 
           Q78 2 70 2 L70 2 
           Q66 2 66 6 Z" 
        fill="#3d3d3d" stroke="#555" stroke-width="1"/>

  <!-- Tread surface (outer edge) -->
  <rect x="76" y="6" width="8" height="116" rx="3" fill="#4a4a4a" stroke="#666" stroke-width="0.5"/>

  <!-- Inner liner -->
  <rect x="66" y="32" width="12" height="64" rx="2" fill="#2a2a2a" stroke="#555" stroke-width="0.5"/>

  <!-- Rim cross-section -->
  <rect x="66" y="34" width="8" height="60" rx="1" fill="url(#rim)" opacity="0.6"/>

  <!-- Steel belt layers -->
  <line x1="68" y1="16" x2="82" y2="16" stroke="#888" stroke-width="1" opacity="0.5"/>
  <line x1="68" y1="20" x2="80" y2="20" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <line x1="68" y1="108" x2="80" y2="108" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <line x1="68" y1="112" x2="82" y2="112" stroke="#888" stroke-width="1" opacity="0.5"/>

  <!-- Cut line (center divider) -->
  <line x1="66" y1="0" x2="66" y2="128" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>

  <!-- PM Text -->
  <text x="90" y="60" fill="#00e5ff" font-family="Arial Black, Impact, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="-1">P</text>
  <text x="90" y="82" fill="#00e5ff" font-family="Arial Black, Impact, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="-1">M</text>
</svg>

